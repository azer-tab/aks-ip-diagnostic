name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # setuptools-scm needs Git tags and history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -m setuptools_scm)"

          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Run tests
        run: |
          python -m compileall -q src tests examples
          pytest -q
          ruff check .
          ruff format --check .
          bandit -r src -x tests
          pip-audit

      - name: Build Python package
        run: |
          rm -rf dist build ./*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Verify built package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          python - "$TAG_VERSION" <<'PY'
          import pathlib
          import sys
          import zipfile
          from email.parser import Parser

          expected_version = sys.argv[1]
          wheels = list(pathlib.Path("dist").glob("*.whl"))

          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, found {len(wheels)}: {wheels}"
              )

          wheel = wheels[0]

          with zipfile.ZipFile(wheel) as archive:
              metadata_files = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]

              if len(metadata_files) != 1:
                  raise SystemExit(
                      "Expected exactly one METADATA file in "
                      f"{wheel}, found {metadata_files}"
                  )

              metadata_text = archive.read(metadata_files[0]).decode("utf-8")

          actual_version = Parser().parsestr(metadata_text)["Version"]

          print(f"Expected version: {expected_version}")
          print(f"Wheel version:    {actual_version}")

          if actual_version != expected_version:
              raise SystemExit(
                  f"Wheel version {actual_version!r} does not match "
                  f"tag version {expected_version!r}"
              )
          PY

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  dockerhub:
    runs-on: ubuntu-latest
    needs: build-python
    if: ${{ vars.PUBLISH_DOCKERHUB == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aks-ip-diagnostic:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aks-ip-diagnostic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-latest
    needs: build-python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint charts/aks-ip-diagnostic \
            --set image.tag="${{ steps.version.outputs.version }}"

      - name: Package chart
        run: |
          mkdir -p dist

          helm package charts/aks-ip-diagnostic \
            --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error