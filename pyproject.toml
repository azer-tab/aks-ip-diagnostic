[build-system]
requires = [
  "setuptools>=83",
  "setuptools-scm>=9.2",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "aks-ip-diagnostic"
dynamic = ["version"]

description = "Read-only AKS IP capacity and network diagnostics"
readme = { file = "README.md", content-type = "text/markdown" } 
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Azer" },
]

keywords = [
  "aks",
  "azure",
  "kubernetes",
  "networking",
  "ip-addresses",
  "diagnostics",
  "subnet",
  "capacity",
  "cli",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

dependencies = [
  "azure-identity>=1.16,<2",
  "azure-mgmt-containerservice>=30,<40",
  "azure-mgmt-network>=25,<30",
  "kubernetes>=29,<35",
  "PyYAML>=6,<7",
  "jsonschema>=4,<5",
  "tabulate>=0.9,<1",
  "rich>=13,<15",
  "colorama>=0.4,<1",
  "requests>=2.31,<3",
  "urllib3>=2.7,<3",
]


[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "build>=1,<2",
  "pip-audit>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "twine>=6,<7",
]


[project.scripts]
aks-ip-diagnostic = "aks_ip_diagnostic.cli:main"


[project.urls]
Homepage = "https://github.com/azer-tab/aks-ip-diagnostic"
Documentation = "https://github.com/azer-tab/aks-ip-diagnostic#readme"
Repository = "https://github.com/azer-tab/aks-ip-diagnostic"
Issues = "https://github.com/azer-tab/aks-ip-diagnostic/issues"
Changelog = "https://github.com/azer-tab/aks-ip-diagnostic/releases"


[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
py-modules = ["main"]


[tool.setuptools.packages.find]
where = ["src"]
include = [
  "aks_ip_diagnostic*",
  "aks_clients*",
  "diagnostics*",
  "reports*",
]


[tool.setuptools.package-data]
aks_ip_diagnostic = ["py.typed"]


[tool.setuptools_scm]
version_file = "src/aks_ip_diagnostic/_version.py"
local_scheme = "no-local-version"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-q",
  "--strict-config",
  "--strict-markers",
]


[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
  "src/aks_ip_diagnostic/_version.py",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "E501",
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.bandit]
exclude_dirs = [
  "tests",
  ".venv",
  "build",
  "dist",
]
skips = []
